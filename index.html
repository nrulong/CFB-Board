const EXTRA_INTEL={
'Villanova @ Louisville':`Stuckey (discussion) — Louisville is in a tricky short-week spot after a physical close loss, with SMU on deck and limited QB depth. He expects a big early lead but a quick move to backups and mentioned Villanova as a possible second-half live look.`,
'Richmond @ NC State':`BetLabs — Over 48.5 (-110), 1u; playable below 51 at the same risk. NC State is in a home-opener bounce-back after scoring only 8 at Virginia; expects Bailey and the offense to attack, with Richmond needing only 7–10 points. BetLabs projection: roughly 47-10.`,
'Missouri @ Kansas':`BetLabs — Kansas +5.5 (-110), 1u; +4.5 is still playable. Likes the first Border Showdown in Lawrence since 2005, Friday-night atmosphere, revenge after last year's late collapse, Missouri defensive turnover and Kansas QB mobility. Notes Leipold is 19-7 ATS as a home dog in his career and 6-0 ATS since 2023.`,
'Oklahoma @ Michigan':`Bear Bets — Sammy wanted Michigan +6.5 because the summer line was near pick'em and sees the move as an overreaction, but missed the best number. Bear prefers the under/Michigan team-total-under angle because Michigan showed little evidence it can score consistently on Oklahoma. Geoff/Greg McElroy think Michigan must simplify Underwood's reads, use quick throws, move the launch point and run the QB; the offensive line/run game remain major concerns.`,
'Ohio State @ Texas':`Bear Bets — Geoff leans Texas because the Longhorn DL can stress Ohio State's tackles; Bear's best-bet preference is Texas moneyline, while Sammy cites a veteran-bookmaker warning about laying Sark as a small favorite and is more cautious. Greg McElroy likes Arch Manning's maturation, upgraded skill talent and Texas' pass-rush matchup, and leans Texas in the rematch.`,
'Arizona State @ Texas A&M':`Bear Bets — Bear leans under: Texas A&M's offense was uneven and ASU still has major QB/trench uncertainty, so he sees A&M leaning on the run in a lower-scoring game. Sammy laid A&M -14 earlier but says 14.5 is a materially different conversation; favorite-or-pass.`,
'Oregon @ Oklahoma State':`Bear Bets — Geoff leans Oregon (not an official best bet): Oregon averaged about 8 yards/play vs Boise and its DL generated roughly 20 pressures, while Oklahoma State's OL was poor vs Tulsa. He flags the noon ET/body-clock issue because Oregon has started slowly in similar early road windows, but expects a better offensive plan. Sammy expects a potential blowout.`,
'Old Dominion @ Virginia Tech':`Duck — Virginia Tech -18.5 [Power-4 play]. VT's Week 1 opponent was weak, but the execution, intensity, QB play and run game looked cleaner. ODU's offense is heavily dependent on Hennicle; Duck also likes the revenge/setup after ODU embarrassed VT last year and expects Franklin to keep sending a message.`,
'Alabama @ Kentucky':`Bear Bets — Bear and Sammy both see value in Kentucky getting double digits because of the freshman Alabama QB's first road start and a potentially loud Stein home debut; Geoff is more hesitant because of Alabama's talent edge. Greg McElroy says road noise can magnify Alabama's pre-snap/protection issues and Kentucky's TEs can stress Bama's nickel, though he thinks Alabama's OL may match Kentucky's front better than some twist-heavy G6 looks.`,
'Mississippi State @ Minnesota':`Bear Bets — Sammy likes Minnesota +1.5 and the more stable run/defense profile. Bear is directly opposite with Mississippi State ML/+1.5, calling MSU underrated and noting Minnesota has struggled historically in true coin-flip home games. Geoff cautions that trend angles matter most when the football explanation supports them.`,
'Duke @ Illinois':`Bear Bets — Sammy is on Duke +6, pointing back to last year's game when Duke piled up yardage but was undone by a huge turnover count. Bear's preferred angle is Under 51.5 because neither offense impressed in Week 1.`,
'UTSA @ Texas State':`Mike Calabrese — Over 65.5, playable to 68. Expects a track meet: both offenses can run and create explosives, Texas State plays fast, and extreme heat can expose G6 defensive depth. Duck agrees Texas State can run on UTSA and that explosive play-action chances should be available; he could see something like 31-28 by mid-third quarter.`,
'Sacred Heart @ UMass':`Stuckey (discussion) — Mentioned a possible Sacred Heart +24.5 dabble because the UMass market adjustment/hype may have gone too far. He wanted additional confirmation before making it a real position.`,
'UNLV @ North Texas':`Mike Calabrese — UNLV -3.5 [Best Bet]. North Texas' coverage was badly exposed, and he expects UNLV to lean on Jet Thomas, reduce Jackson Arnold's negative dropbacks and create explosives via play action/RPO. Projects UNLV by double digits, directly conflicting with the early North Texas +6.5 position.`,
'Memphis @ Boise State':`Mike Calabrese (discussion) — Memphis' offense is a real positive: Kevin Decker's scheme is creating open running lanes and Jalen Carter erupted for 183 yards and four TDs. Memphis has averaged 42+ points over its last five since Carter became a featured piece, which is useful counter-intel against the Boise side.`,
'Buffalo @ Florida International':`Bear — FIU -10.5 [Best Bet]. FIU's defense held up well against USF; Buffalo has a freshman QB plus rebuilt offensive and defensive lines. Bear thinks Buffalo may struggle badly to score and floated a 27-3 type game script.`,
'Tennessee @ Georgia Tech':`BBOC discussion — Beyond the shared Georgia Tech side, Collin saw real signs of life in GT's loss: GT won yards/play, Alberto Mendoza made two big-time throws with no turnover-worthy plays despite pressure, and he thinks more designed QB run can unlock the backs. Tennessee's secondary remains unproven with multiple season-ending injuries.`,
'Tulsa @ Sam Houston':`Duck — Tulsa -13.5 [Best Bet]. Sam Houston's OL allowed 13 tackles for loss and four sacks against Troy; Tulsa's front already overwhelmed Oklahoma State. Duck trusts Baylor Hayes' year-two development and Tulsa's outside run game, and expects Tulsa to control both lines and win by roughly three TDs.`,
'Georgia State @ Kennesaw State':`Stuckey (discussion/lean) — Likes Georgia State +points and makes the game under a TD. He prefers Cameron Brown at QB, likes the upgraded offensive staff and fades Ricky Collins; short-trip rivalry. Collin's preferred angle is the over, which had already drawn market money near the key total of 55.`,
'San Diego State @ UCLA':`BBOC — Stuckey would take UCLA up to -14 and the over through 55; he expects a vertical/explosive game after SDSU allowed air explosives and UCLA generated five explosive drives in 14 possessions. Bear Bets — Geoff also likes the over despite missing the best early number, buying the UCLA offense under Chesney and expecting SDSU's offense-first identity to leave defensive tradeoffs.`,
'Louisiana Tech @ LSU':`Stuckey (discussion/pass) — Flags a classic look-ahead/focus spot: LSU is off a huge win with Ole Miss on deck, and he does not want to lay the big number. Collin projected the spread around 34 and thinks numbers above 35 are getting oversold, but also doesn't want to step in front of LSU. Bear Bets/Greg McElroy broader intel: LSU's passing game can still improve, but the backs ran through contact and the defense looked legitimately athletic and disruptive.`,
'Iowa State @ Iowa':`BBOC — Stuckey is essentially dead on the spread and passes; 17 of the last 20 in the rivalry had gone under. Collin leans Iowa but is close to the number: Kamari Molton was dominant, while Iowa State failed to produce a methodical drive and relied on explosives. He's also interested in how ISU's new four-man front handles Iowa's run game and likes the under.`,
'Georgia Southern @ Clemson':`Bear Bets / Greg McElroy (team intel) — Clemson still has talent, but McElroy was more concerned about Clemson than Florida State after Week 1 because of the game plan/adjustment issues and the experience gap created when transfer-heavy opponents bring far more college snap equity. Not a Georgia Southern bet, but meaningful Clemson-state-of-team context.`,
'Navy @ Florida Atlantic':`BBOC/Bear discussion — Collin says Navy's pass defense looked very vulnerable and thinks FAU can move the ball; Stuckey expects heavy fourth-down variance and sees it as a good live-trading game. Sammy P's Bear Bets best bet is FAU +5 and he also sees outright-upset potential. Duck separately noted Towson completed 70% and hit multiple explosive passes on Navy.`,
'Charlotte @ Ole Miss':`Stuckey (discussion) — Opposite the Duck first-half-over angle on the full-game spread: he likes Charlotte at very large numbers (45+), arguing Ole Miss has LSU on deck, may rest Lacy/OL pieces and avoid running Chambliss, and could build a big lead then park the bus with backups. Duck still likes 1H Over 34.5 because Charlotte's defense may not get a first-half stop.`,
'North Dakota State @ Air Force':`Stuckey/Collin discussion — Stuckey thinks this is where NDSU's schedule gets real: road altitude, unfamiliar environment and a fresh Air Force option attack. NDSU saw an option recently but has limited meaningful modern history against this style. Collin calls Air Force the service academy he is highest on.`,
'Arkansas @ Utah':`Collin Wilson (discussion) — Very down on Arkansas' offense after Week 1: QB play was short-area only with poor downfield production and long time-to-throw, while the backs generated little after contact. His power number is closer to Utah -9, so he acknowledges a premium, but the football matchup still points Utah rather than taking Arkansas.`,
'Sacramento State @ Fresno State':`BBOC discussion — Stuckey calls Sacramento State one of the worst teams on the board and expects the backup-QB offense to struggle; Fresno should control the game and the under also fits. Collin says this is his favorite of the ugly/big-favorite group because Sacramento State is so weak.`,
'Montana State @ Nevada':`Duck — Nevada +160 ML-parlay leg. Montana State is an elite FCS team but has only faced weak opposition and is down a notch in the trenches with a safety injury. Duck likes Nevada's improved physicality, QB play and defensive havoc, plus Choate's familiarity with his former Montana State program; he lined the game near pick'em.`,
'Mercyhurst @ New Mexico':`Bear Bets (discussion only) — Noted the unusual travel setup: Mercyhurst played New Mexico State the prior week and may have stayed in the state rather than fly back to Pennsylvania and return. No betting opinion was given.`};

function mins(t){if(t==='TBA')return 9999;const m=t.match(/(\d+):(\d+)\s*(AM|PM)/);if(!m)return 9999;let h=+m[1]%12;if(m[3]==='PM')h+=12;return h*60+(+m[2])}function day(o){return dateOf(o).startsWith('Fri')?0:1}function sorted(a){return [...a].sort((x,y)=>day(x)-day(y)||mins(timeOf(x))-mins(timeOf(y))||String(x.Game).localeCompare(String(y.Game)))}
function mergeSlate(data){data.allGames=data.allGames||[];const byGame=new Map(data.allGames.map(x=>[x.Game,x]));for(const [Date,time,Game] of SLATE){const m=MARKETS[Game]||['',''];const extra=EXTRA_INTEL[Game]||'';if(byGame.has(Game)){const x=byGame.get(Game);x.Date=Date;x['Time ET']=time;x['Current Spread']=m[0];x['Current Total']=m[1];if(x['Tracked Analysis / Picks']==='No tracked intel yet.')x['Tracked Analysis / Picks']='';if(extra&&!String(x['Tracked Analysis / Picks']||'').includes(extra))x['Tracked Analysis / Picks']=[x['Tracked Analysis / Picks'],extra].filter(Boolean).join('\n\n')}else data.allGames.push({Date,'Time ET':time,Game,'Current Spread':m[0],'Current Total':m[1],'My Ticket':'','SP+ Spread':'','SP+ Total':'','Tracked Analysis / Picks':extra})}for(const p of data.myPicks||[]){const s=scheduleMap.get(p.Game);if(s){p.Date=s.Date;p['Time ET']=s.time}}return data}
const splitLines=s=>String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).filter(x=>!/^user\b/i.test(x.replace(/^•\s*/,''))).filter(x=>x!=='No tracked intel yet.');const bullets=t=>{const a=splitLines(t);return a.length?`<ul class="bullets">${a.map(x=>`<li>${esc(x.replace(/^•\s*/,''))}</li>`).join('')}</ul>`:''};const top=o=>`<div class="topline"><div class="game">${esc(o.Game)}</div><div class="time">${esc(dateOf(o))}<br>${esc(timeOf(o))} ET</div></div>`;
function groupCards(a,fn){let out='',last='';for(const o of sorted(a)){const label=`${dateOf(o)} • ${timeOf(o)} ET`;if(label!==last){out+=`<div class="kickoff">${esc(label)}</div>`;last=label}out+=fn(o)}return out}
function renderMine(){const a=DATA.myPicks||[];els.mine.innerHTML=`<div class="summary"><div class="kpi"><b>${a.length}</b><span>confirmed bets</span></div><div class="kpi"><b>${a.filter(x=>String(x.Read).includes('🔥')).length}</b><span>🔥 supported</span></div><div class="kpi"><b>${a.filter(x=>/[⚔⚠]/.test(String(x.Read))).length}</b><span>conflict/watch</span></div></div>`+groupCards(a,o=>`<article class="card searchable" data-search="${esc(JSON.stringify(o).toLowerCase())}">${top(o)}<div class="pick">${esc(o['My Pick'])} ${esc(o.Read)}</div><div class="meta">${o['SP+ Spread']?`<span class="chip">SP+ Spread: ${esc(o['SP+ Spread'])}</span>`:''}${o['SP+ Total']?`<span class="chip">SP+ Total: ${esc(o['SP+ Total'])}</span>`:''}</div>${bullets(o['Capper / Model Analysis'])}</article>`)}
function renderGames(){const a=DATA.allGames||[];els.games.innerHTML=`<div class="summary"><div class="kpi"><b>${a.length}</b><span>weekend FBS games</span></div><div class="kpi"><b>${a.filter(x=>x['My Ticket']).length}</b><span>with my ticket</span></div><div class="kpi"><b>${a.filter(x=>splitLines(x['Tracked Analysis / Picks']).length).length}</b><span>with intel</span></div></div>`+groupCards(a,o=>`<article class="card searchable" data-search="${esc(JSON.stringify(o).toLowerCase())}">${top(o)}<div class="marketline">Current: ${esc(o['Current Spread']||'—')} • O/U ${esc(o['Current Total']||'—')}</div><div class="meta">${o['My Ticket']?`<span class="chip mine">🎟️ ${esc(o['My Ticket'])}</span>`:''}${o['SP+ Spread']?`<span class="chip">SP+ Spread: ${esc(o['SP+ Spread'])}</span>`:''}${o['SP+ Total']?`<span class="chip">SP+ Total: ${esc(o['SP+ Total'])}</span>`:''}</div>${bullets(o['Tracked Analysis / Picks'])}</article>`)}
function renderExperts(){const groups={};(DATA.experts||[]).forEach(o=>(groups[o.Capper]??=[]).push(o));els.experts.innerHTML=Object.entries(groups).map(([capper,rows])=>`<div class="section-title">${esc(capper)} · ${rows.length} tracked</div>`+rows.map(o=>`<article class="card searchable" data-search="${esc(JSON.stringify(o).toLowerCase())}"><div class="capper-head"><div class="game">${esc(o.Game)}</div><span class="tag">${esc(o.Classification)}</span></div><div class="pick">${esc(o['Pick / Number'])}</div>${bullets(o['One-Bullet Logic'])}</article>`).join('')).join('')}
function applySearch(){const q=els.search.value.trim().toLowerCase();document.querySelectorAll(`#${active} .searchable`).forEach(x=>x.classList.toggle('hidden',!!q&&!x.dataset.search.includes(q)))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==active));applySearch()});els.search.oninput=applySearch;els.clear.onclick=()=>{els.search.value='';applySearch()};
fetch('./board-data.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{DATA=mergeSlate(d);els.subtitle.textContent=`${DATA.week||'Week 2'} • Market snapshot Sep 11 • ${DATA.marketSource||''}`;els.status.className='status ok';els.status.textContent=`✓ ${(DATA.myPicks||[]).length} picks • ${(DATA.allGames||[]).length} games • ${(DATA.experts||[]).length} expert entries`;renderMine();renderGames();renderExperts()}).catch(e=>{els.status.className='status err';els.status.textContent='✕ Board data failed to load: '+e.message})})();</script></body></html>
