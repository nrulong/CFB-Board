<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>CFB Betting HQ</title>
<style>:root{--bg:#07101d;--panel:#0d1828;--panel2:#111f33;--line:#22324a;--text:#f3f7ff;--muted:#9db0c9;--chip:#172941;--green:#8de5aa;--red:#ff8a8a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#0a1321 42%,#08111d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.app{max-width:960px;margin:auto;padding:0 12px 80px}header{position:sticky;top:0;z-index:20;background:rgba(7,16,29,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 0}h1{font-size:20px;margin:0 0 3px}.sub,.time,.footer{color:var(--muted);font-size:11px}.status{margin-top:4px;font-size:11px;font-weight:800}.status.ok{color:var(--green)}.status.err{color:var(--red)}.tabs{display:flex;gap:8px;overflow-x:auto;padding:11px 0 1px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}.tab.active{background:var(--text);color:#09111d}.toolbar{display:flex;gap:8px;margin:14px 0 12px}.search{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text);font-size:15px}.action{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:0 12px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}.kpi,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}.kpi{padding:10px}.kpi b{font-size:18px;display:block}.kpi span{font-size:10px;color:var(--muted)}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));padding:13px;margin:9px 0}.topline,.capper-head{display:flex;justify-content:space-between;gap:8px}.game{font-size:15px;font-weight:900}.time{text-align:right;white-space:nowrap}.pick{font-size:18px;font-weight:900;margin:7px 0 5px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}.chip,.tag{background:var(--chip);border:1px solid #29415f;color:#cfe0f6;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.chip.mine{color:#fff2b8;border-color:#625526;background:#2a2616}.bullets{margin:7px 0 0;padding:0;list-style:none}.bullets li{border-top:1px solid rgba(157,176,201,.14);padding:8px 0 0;margin-top:8px;font-size:13px;line-height:1.42;color:#d9e4f2}.bullets li:first-child{border-top:0;margin-top:0;padding-top:0}.section-title,.kickoff{font-size:13px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin:18px 2px 8px}.kickoff{font-size:14px;color:#f3f7ff;padding-bottom:6px;border-bottom:1px solid var(--line)}.hidden{display:none!important}.footer{margin:20px 4px}.marketline{font-size:14px;font-weight:850;margin:6px 0 2px;color:#dff6e7}.emptyintel{color:var(--muted);font-size:12px;margin-top:7px}</style></head>
<body><div class="app"><header><h1>🏈 CFB Betting HQ</h1><div id="subtitle" class="sub">Loading board…</div><div id="status" class="status"></div><div class="tabs"><button class="tab active" data-tab="mine">🎟️ My Picks</button><button class="tab" data-tab="games">📅 All Games</button><button class="tab" data-tab="experts">👥 Experts</button></div></header><div class="toolbar"><input id="search" class="search" placeholder="Search team, pick, capper…"><button id="clear" class="action">Clear</button></div><div id="mine" class="view"></div><div id="games" class="view hidden"></div><div id="experts" class="view hidden"></div><div class="footer">Kickoff times are Eastern. All Games contains the complete Friday/Saturday FBS slate, including FCS-at-FBS matchups. Intel is layered in as we track it.</div></div>
<script>(()=>{'use strict';const E=id=>document.getElementById(id),els={subtitle:E('subtitle'),status:E('status'),mine:E('mine'),games:E('games'),experts:E('experts'),search:E('search'),clear:E('clear')};let DATA={myPicks:[],allGames:[],experts:[]},active='mine';
const SLATE=[
['Fri Sep 11','7:00 PM','Villanova @ Louisville'],['Fri Sep 11','7:00 PM','Norfolk State @ Virginia'],['Fri Sep 11','7:00 PM','Richmond @ NC State'],['Fri Sep 11','7:30 PM','Rutgers @ Boston College'],['Fri Sep 11','8:00 PM','Missouri @ Kansas'],
['Sat Sep 12','12:00 PM','Oregon @ Oklahoma State'],['Sat Sep 12','12:00 PM','Howard @ Indiana'],['Sat Sep 12','12:00 PM','Arizona State @ Texas A&M'],['Sat Sep 12','12:00 PM','Oklahoma @ Michigan'],['Sat Sep 12','12:00 PM','Penn State @ Temple'],['Sat Sep 12','12:00 PM','Washington State @ Kansas State'],['Sat Sep 12','12:00 PM','East Tennessee State @ North Carolina'],['Sat Sep 12','12:00 PM','Old Dominion @ Virginia Tech'],['Sat Sep 12','12:00 PM','Wake Forest @ Purdue'],['Sat Sep 12','12:00 PM','South Florida @ Army'],['Sat Sep 12','12:00 PM','Appalachian State @ East Carolina'],['Sat Sep 12','12:00 PM','Wofford @ Kent State'],['Sat Sep 12','12:45 PM','Western Kentucky @ Georgia'],['Sat Sep 12','1:00 PM','UT Martin @ West Virginia'],['Sat Sep 12','1:00 PM','Colgate @ Central Michigan'],['Sat Sep 12','1:00 PM','Holy Cross @ Miami (Ohio)'],['Sat Sep 12','2:00 PM','Stony Brook @ Ball State'],
['Sat Sep 12','3:30 PM','Rice @ Notre Dame'],['Sat Sep 12','3:30 PM','Alabama @ Kentucky'],['Sat Sep 12','3:30 PM','Arizona @ BYU'],['Sat Sep 12','3:30 PM','Utah State @ Washington'],['Sat Sep 12','3:30 PM','Mississippi State @ Minnesota'],['Sat Sep 12','3:30 PM','Weber State @ Colorado'],['Sat Sep 12','3:30 PM','UCF @ Pitt'],['Sat Sep 12','3:30 PM','California @ Syracuse'],['Sat Sep 12','3:30 PM','Duke @ Illinois'],['Sat Sep 12','3:30 PM','Eastern Michigan @ Michigan State'],['Sat Sep 12','3:30 PM','Maryland @ UConn'],['Sat Sep 12','3:30 PM','UTSA @ Texas State'],['Sat Sep 12','3:30 PM','UL Monroe @ UAB'],['Sat Sep 12','3:30 PM','Robert Morris @ Akron'],['Sat Sep 12','3:30 PM','Central Connecticut @ Toledo'],['Sat Sep 12','3:30 PM','Sacred Heart @ UMass'],['Sat Sep 12','3:30 PM','Wagner @ James Madison'],['Sat Sep 12','3:45 PM','UNLV @ North Texas'],['Sat Sep 12','4:00 PM','UC Davis @ SMU'],['Sat Sep 12','4:00 PM','Northern Colorado @ Wyoming'],['Sat Sep 12','4:00 PM','Mercyhurst @ New Mexico'],['Sat Sep 12','4:00 PM','Alabama State @ Troy'],['Sat Sep 12','4:15 PM','Delaware @ Vanderbilt'],['Sat Sep 12','5:30 PM','Campbell @ Florida'],
['Sat Sep 12','6:00 PM','Memphis @ Boise State'],['Sat Sep 12','6:00 PM','Buffalo @ Florida International'],['Sat Sep 12','6:00 PM','Jacksonville State @ Ohio'],['Sat Sep 12','6:00 PM','Gardner-Webb @ Liberty'],['Sat Sep 12','6:30 PM','Monmouth @ Western Michigan'],
['Sat Sep 12','7:00 PM','Tennessee @ Georgia Tech'],['Sat Sep 12','7:00 PM','Southern @ Houston'],['Sat Sep 12','7:00 PM','Towson @ South Carolina'],['Sat Sep 12','7:00 PM','Western Carolina @ Cincinnati'],['Sat Sep 12','7:00 PM','Bowling Green @ Nebraska'],['Sat Sep 12','7:00 PM','Southern Utah @ Colorado State'],['Sat Sep 12','7:00 PM','Tulsa @ Sam Houston'],['Sat Sep 12','7:00 PM','Illinois State @ Northern Illinois'],['Sat Sep 12','7:00 PM','South Alabama @ Tulane'],['Sat Sep 12','7:00 PM','West Georgia @ Arkansas State'],['Sat Sep 12','7:00 PM','Georgia State @ Kennesaw State'],['Sat Sep 12','7:00 PM','Middle Tennessee @ Marshall'],['Sat Sep 12','7:00 PM','Lindenwood @ Missouri State'],['Sat Sep 12','7:15 PM','San Diego State @ UCLA'],['Sat Sep 12','7:15 PM','Western Illinois @ Wisconsin'],['Sat Sep 12','7:30 PM','Ohio State @ Texas'],['Sat Sep 12','7:30 PM','Louisiana Tech @ LSU'],['Sat Sep 12','7:30 PM','Texas Tech @ Oregon State'],['Sat Sep 12','7:30 PM','Iowa State @ Iowa'],['Sat Sep 12','7:30 PM','Georgia Southern @ Clemson'],['Sat Sep 12','7:30 PM','Navy @ Florida Atlantic'],['Sat Sep 12','7:30 PM','Fordham @ Coastal Carolina'],['Sat Sep 12','7:45 PM','Charlotte @ Ole Miss'],['Sat Sep 12','7:45 PM','Southern Miss @ Auburn'],['Sat Sep 12','8:00 PM','Prairie View A&M @ Baylor'],['Sat Sep 12','8:00 PM','Grambling @ TCU'],['Sat Sep 12','9:00 PM','Texas Southern @ UTEP'],['Sat Sep 12','9:00 PM','Cal Poly @ San Jose State'],['Sat Sep 12','10:00 PM','North Dakota State @ Air Force'],['Sat Sep 12','10:15 PM','Arkansas @ Utah'],['Sat Sep 12','10:30 PM','Sacramento State @ Fresno State'],['Sat Sep 12','10:30 PM','Montana State @ Nevada'],['Sat Sep 12','11:00 PM','Louisiana @ USC'],['Sat Sep 12','11:59 PM','New Mexico State @ Hawaii']];
const scheduleMap=new Map(SLATE.map(([Date,time,Game])=>[Game,{Date,time}]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const timeOf=o=>o['Time ET']||scheduleMap.get(o.Game)?.time||'TBA';const dateOf=o=>o.Date||scheduleMap.get(o.Game)?.Date||'Sat Sep 12';
function mins(t){if(t==='TBA')return 9999;const m=t.match(/(\d+):(\d+)\s*(AM|PM)/);if(!m)return 9999;let h=+m[1]%12;if(m[3]==='PM')h+=12;return h*60+(+m[2])}function day(o){return dateOf(o).startsWith('Fri')?0:1}function sorted(a){return [...a].sort((x,y)=>day(x)-day(y)||mins(timeOf(x))-mins(timeOf(y))||String(x.Game).localeCompare(String(y.Game)))}
function mergeSlate(data){data.allGames=data.allGames||[];const byGame=new Map(data.allGames.map(x=>[x.Game,x]));for(const [Date,time,Game] of SLATE){if(byGame.has(Game)){const x=byGame.get(Game);x.Date=Date;x['Time ET']=time}else{data.allGames.push({Date,'Time ET':time,Game,'Current Spread':'','Current Total':'','My Ticket':'','SP+ Spread':'','SP+ Total':'','Tracked Analysis / Picks':''})}}for(const p of data.myPicks||[]){const s=scheduleMap.get(p.Game);if(s){p.Date=s.Date;p['Time ET']=s.time}}return data}
const splitLines=s=>String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).filter(x=>!/^user\b/i.test(x.replace(/^•\s*/,'')));const bullets=t=>{const a=splitLines(t);return a.length?`<ul class="bullets">${a.map(x=>`<li>${esc(x.replace(/^•\s*/,''))}</li>`).join('')}</ul>`:''};const top=o=>`<div class="topline"><div class="game">${esc(o.Game)}</div><div class="time">${esc(dateOf(o))}<br>${esc(timeOf(o))} ET</div></div>`;
function groupCards(a,fn){let out='',last='';for(const o of sorted(a)){const label=`${dateOf(o)} • ${timeOf(o)} ET`;if(label!==last){out+=`<div class="kickoff">${esc(label)}</div>`;last=label}out+=fn(o)}return out}
function renderMine(){const a=DATA.myPicks||[];els.mine.innerHTML=`<div class="summary"><div class="kpi"><b>${a.length}</b><span>confirmed bets</span></div><div class="kpi"><b>${a.filter(x=>String(x.Read).includes('🔥')).length}</b><span>🔥 supported</span></div><div class="kpi"><b>${a.filter(x=>/[⚔⚠]/.test(String(x.Read))).length}</b><span>conflict/watch</span></div></div>`+groupCards(a,o=>`<article class="card searchable" data-search="${esc(JSON.stringify(o).toLowerCase())}">${top(o)}<div class="pick">${esc(o['My Pick'])} ${esc(o.Read)}</div><div class="meta">${o['SP+ Spread']?`<span class="chip">SP+ Spread: ${esc(o['SP+ Spread'])}</span>`:''}${o['SP+ Total']?`<span class="chip">SP+ Total: ${esc(o['SP+ Total'])}</span>`:''}</div>${bullets(o['Capper / Model Analysis'])}</article>`)}
function renderGames(){const a=DATA.allGames||[];els.games.innerHTML=`<div class="summary"><div class="kpi"><b>${a.length}</b><span>weekend FBS games</span></div><div class="kpi"><b>${a.filter(x=>x['My Ticket']).length}</b><span>with my ticket</span></div><div class="kpi"><b>${a.filter(x=>x['Tracked Analysis / Picks']).length}</b><span>with intel</span></div></div>`+groupCards(a,o=>`<article class="card searchable" data-search="${esc(JSON.stringify(o).toLowerCase())}">${top(o)}${(o['Current Spread']||o['Current Total'])?`<div class="marketline">Current: ${esc(o['Current Spread']||'Spread —')} • O/U ${esc(o['Current Total']||'—')}</div>`:''}<div class="meta">${o['My Ticket']?`<span class="chip mine">🎟️ ${esc(o['My Ticket'])}</span>`:''}${o['SP+ Spread']?`<span class="chip">SP+ Spread: ${esc(o['SP+ Spread'])}</span>`:''}${o['SP+ Total']?`<span class="chip">SP+ Total: ${esc(o['SP+ Total'])}</span>`:''}</div>${o['Tracked Analysis / Picks']?bullets(o['Tracked Analysis / Picks']):'<div class="emptyintel">No tracked intel yet.</div>'}</article>`)}
function renderExperts(){const groups={};(DATA.experts||[]).forEach(o=>(groups[o.Capper]??=[]).push(o));els.experts.innerHTML=Object.entries(groups).map(([capper,rows])=>`<div class="section-title">${esc(capper)} · ${rows.length} tracked</div>`+rows.map(o=>`<article class="card searchable" data-search="${esc(JSON.stringify(o).toLowerCase())}"><div class="capper-head"><div class="game">${esc(o.Game)}</div><span class="tag">${esc(o.Classification)}</span></div><div class="pick">${esc(o['Pick / Number'])}</div>${o['One-Bullet Logic']?`<ul class="bullets"><li>${esc(o['One-Bullet Logic'])}</li></ul>`:''}</article>`).join('')).join('')}
function applySearch(){const q=els.search.value.trim().toLowerCase();document.querySelectorAll(`#${active} .searchable`).forEach(el=>el.classList.toggle('hidden',!!q&&!el.dataset.search.includes(q)))}document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{active=btn.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==active));applySearch()}));els.search.addEventListener('input',applySearch);els.clear.addEventListener('click',()=>{els.search.value='';applySearch()});
fetch('./board-data.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`board-data.json returned HTTP ${r.status}`);return r.json()}).then(data=>{DATA=mergeSlate(data);els.subtitle.textContent=`${DATA.week||''} • Complete Fri/Sat FBS slate • ${DATA.marketSource||''}`;els.status.className='status ok';els.status.textContent=`✓ ${(DATA.myPicks||[]).length} picks • ${(DATA.allGames||[]).length} games • ${(DATA.experts||[]).length} expert entries`;renderMine();renderGames();renderExperts()}).catch(err=>{els.status.className='status err';els.status.textContent='✕ Board failed to load';console.error(err)})})();</script></body></html>
